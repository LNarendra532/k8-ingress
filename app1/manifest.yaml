apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  # deployment labels
  labels:
    purpose: ingress
    project: roboshop
    app: app1
spec:
  replicas: 2
  # These are the labels replica set use to create pod replicas, this should match pod labels
  selector:
    matchLabels:
      purpose: ingress
      project: roboshop
      app: app1
  # This is pod definition
  template:
    metadata:
      labels:
        purpose: ingress
        project: roboshop
        app: app1
    spec:
      containers:
      - name: app1
        image: joindevops/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  labels:
    purpose: ingress
    project: roboshop
    app: app1
spec:
  selector:
    purpose: ingress
    project: roboshop
    app: app1
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:315069654700:certificate/806e53c3-3894-49ff-96c7-fbd7c3b753ff
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: joindevops
spec:
  ingressClassName: alb
  rules:
  - host: "app1.daws84s.site"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app1
            port:
              number: 80 # app1 service port
              
# Yaml file explanation:
# Deployment: Creates app1 Pods
# apiVersion: apps/v1
# kind: Deployment
# •	Creates 2 replicas (copies) of Pod using image joindevops/app1:v1.
# •	All pods have labels: purpose: ingress, project: roboshop, app: app1.
# •	These labels help connect the Deployment → Pods → Service → Ingress.
# 2. Service: Exposes Pods inside the cluster
# apiVersion: v1
# kind: Service
# •	Creates a ClusterIP service named app1.
# •	It selects pods with matching labels (so it connects to app1 pods).
# •	Service port = 80, forwards traffic to Pod container port = 80.
# 3. Ingress: Routes external traffic via ALB
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# •	Uses AWS ALB Ingress Controller (ingressClassName: alb).
# •	Public ALB: alb.ingress.kubernetes.io/scheme: internet-facing.
# •	HTTPS listener: ALB listens on port 443 (TLS).
# •	ACM Certificate used for SSL (certificate-arn provided).
# •	Target type = ip: ALB forwards traffic directly to Pod IPs.
# •	Host-based rule:
# •	Requests to https://app1.daws84s.site/ go to app1 service on port 80.
# •	Group Name: joindevops (for grouping multiple ingresses under one ALB).
